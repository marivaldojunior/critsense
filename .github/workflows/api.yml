name: API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "contracts/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api/**"
      - "contracts/**"
      - ".github/workflows/api.yml"

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          # Mesma versão do api/.python-version e da imagem Docker.
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Dependências
        run: uv sync --locked

      - name: Lint (Ruff)
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Tipos (mypy)
        run: uv run mypy

      # Roda todos os testes. No runner há Docker, então os testes com
      # Testcontainers (PostgreSQL) rodam aqui, ao contrário de máquinas sem
      # Docker, onde eles são pulados. O test_contract falha se
      # contracts/openapi.yaml estiver diferente do contrato gerado pelo código.
      - name: Testes
        run: uv run pytest --cov=critsense --cov-report=term-missing:skip-covered

      - name: Build da imagem
        run: docker build -t critsense-api .
