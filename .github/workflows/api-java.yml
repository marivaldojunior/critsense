name: API Java (estudo)

on:
  push:
    branches: [main]
    paths:
      - "api-java/**"
      - ".github/workflows/api-java.yml"
  pull_request:
    paths:
      - "api-java/**"
      - ".github/workflows/api-java.yml"

permissions:
  contents: read

concurrency:
  group: api-java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Lint (Spotless)
        run: ./mvnw -B -ntp spotless:check

      # Roda todos os testes. No runner há Docker, então os testes com
      # Testcontainers (PostgreSQL) rodam aqui, ao contrário de máquinas sem
      # Docker, onde eles são pulados. O OpenApiContractTest falha se
      # api-java/openapi.yaml estiver diferente do contrato gerado pelo código.
      - name: Testes e build
        run: ./mvnw -B -ntp verify

      - name: Relatórios dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: api-java/target/surefire-reports/
          retention-days: 7
