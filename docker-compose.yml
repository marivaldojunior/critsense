# Ambiente local: API do CritSense (Python) + PostgreSQL.
#
#   1. Copie .env.example para .env e preencha as chaves.
#   2. docker compose up --build
#
# A API fica em http://localhost:8080 e a documentação em http://localhost:8080/docs.
#
# A API Java de estudo (api-java/) fica no perfil "java", com um banco próprio:
#
#   docker compose --profile java up --build
#
# Ela fica em http://localhost:8081 e a documentação em http://localhost:8081/swagger-ui.html.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: critsense
      POSTGRES_USER: ${DB_USER:-critsense}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-critsense}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-critsense}:${DB_PASSWORD:-critsense}@postgres:5432/critsense
    ports:
      - "8080:8080"

  postgres-java:
    image: postgres:17-alpine
    profiles: [java]
    environment:
      POSTGRES_DB: critsense
      POSTGRES_USER: ${DB_USER:-critsense}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-critsense}
    volumes:
      - postgres-java-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-java:
    build: ./api-java
    profiles: [java]
    depends_on:
      postgres-java:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:postgresql://postgres-java:5432/critsense
      DB_USER: ${DB_USER:-critsense}
      DB_PASSWORD: ${DB_PASSWORD:-critsense}
    ports:
      - "8081:8080"

volumes:
  postgres-data:
  postgres-java-data:
