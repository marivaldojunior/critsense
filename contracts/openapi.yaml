openapi: 3.1.0
info:
  description: "API do CritSense: autenticação e ferramentas de IA para mestres de\
    \ D&D 5e. Conteúdo de regras restrito ao SRD 5.1 (CC-BY-4.0). Todo erro segue\
    \ o formato application/problem+json (RFC 9457), com o campo code."
  license:
    name: SRD 5.1 — CC-BY-4.0
  title: CritSense API
  version: v1
servers:
- description: Local
  url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Erro no formato RFC 9457. Veja o campo code.
      security: []
      summary: Troca usuário e senha por um token de acesso
      tags:
      - Autenticação
  /api/v1/auth/register:
    post:
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Erro no formato RFC 9457. Veja o campo code.
      security: []
      summary: Cria uma conta e devolve um token de acesso
      tags:
      - Autenticação
  /api/v1/me:
    get:
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Erro no formato RFC 9457. Veja o campo code.
      summary: Devolve o usuário do token
      tags:
      - Autenticação
  /api/v1/npcs/generate:
    post:
      description: "Conta no limite de chamadas de IA do usuário (cabeçalho X-RateLimit-Remaining).\
        \ Erros: 429 RATE_LIMITED, 422 AI_REFUSED, 502 AI_INVALID_OUTPUT ou AI_PROVIDER_ERROR,\
        \ 503 AI_UNAVAILABLE, 504 AI_TIMEOUT."
      operationId: generateNpc
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NpcRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NpcResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Erro no formato RFC 9457. Veja o campo code.
      summary: Gera um NPC com a IA
      tags:
      - NPCs
components:
  schemas:
    Alignment:
      type: string
      enum:
      - LAWFUL_GOOD
      - NEUTRAL_GOOD
      - CHAOTIC_GOOD
      - LAWFUL_NEUTRAL
      - TRUE_NEUTRAL
      - CHAOTIC_NEUTRAL
      - LAWFUL_EVIL
      - NEUTRAL_EVIL
      - CHAOTIC_EVIL
    LoginRequest:
      type: object
      description: Credenciais de uma conta existente.
      properties:
        password:
          type: string
          example: uma-senha-longa
          minLength: 1
        username:
          type: string
          example: thorin
          minLength: 1
      required:
      - password
      - username
    MeResponse:
      type: object
      description: Usuário autenticado.
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
    Npc:
      type: object
      description: NPC gerado.
      properties:
        alignment:
          $ref: "#/components/schemas/Alignment"
        appearance:
          type: string
          maxLength: 400
          minLength: 0
        mannerism:
          type: string
          maxLength: 200
          minLength: 0
        motivation:
          type: string
          maxLength: 300
          minLength: 0
        name:
          type: string
          maxLength: 80
          minLength: 0
        personalityTraits:
          type: array
          items:
            type: string
            maxLength: 120
            minLength: 0
          maxItems: 4
          minItems: 2
        race:
          $ref: "#/components/schemas/SrdRace"
        role:
          type: string
          maxLength: 80
          minLength: 0
        secret:
          type: string
          maxLength: 300
          minLength: 0
        storyHooks:
          type: array
          items:
            type: string
            maxLength: 300
            minLength: 0
          maxItems: 3
          minItems: 1
      required:
      - alignment
      - appearance
      - mannerism
      - motivation
      - name
      - personalityTraits
      - race
      - role
      - secret
      - storyHooks
    NpcRequest:
      type: object
      description: "Preferências do NPC. Todo campo é opcional: o que faltar, a IA\
        \ escolhe."
      properties:
        alignment:
          $ref: "#/components/schemas/Alignment"
        context:
          type: string
          description: Descrição livre da campanha ou da cena.
          example: "Uma vila mineira nas montanhas, ameaçada por kobolds."
          maxLength: 1000
          minLength: 0
        race:
          $ref: "#/components/schemas/SrdRace"
          description: Raça do NPC (SRD 5.1).
        role:
          type: string
          description: Ocupação ou papel no mundo.
          example: ferreiro
          maxLength: 60
          minLength: 0
    NpcResponse:
      type: object
      description: NPC gerado e a versão do prompt usada.
      properties:
        npc:
          $ref: "#/components/schemas/Npc"
        promptVersion:
          type: string
          description: Prompt que gerou este NPC.
          example: npc-generator@v1
    Problem:
      type: object
      description: Erro no formato application/problem+json (RFC 9457).
      properties:
        code:
          type: string
          description: "Código estável do erro (ex: RATE_LIMITED)."
          example: RATE_LIMITED
        detail:
          type: string
        errors:
          type: array
          description: "Campos inválidos, só em VALIDATION_FAILED."
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        instance:
          type: string
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          example: urn:critsense:problem:rate-limited
      required:
      - code
      - status
      - title
    RegisterRequest:
      type: object
      description: Dados para criar uma conta.
      properties:
        password:
          type: string
          example: uma-senha-longa
          maxLength: 72
          minLength: 8
        username:
          type: string
          description: "Letras, números, ponto, hífen ou sublinhado."
          example: thorin
          maxLength: 30
          minLength: 3
          pattern: "[A-Za-z0-9._-]+"
      required:
      - password
      - username
    SrdRace:
      type: string
      enum:
      - DRAGONBORN
      - DWARF
      - ELF
      - GNOME
      - HALF_ELF
      - HALF_ORC
      - HALFLING
      - HUMAN
      - TIEFLING
    TokenResponse:
      type: object
      description: "Token de acesso. Envie no cabeçalho Authorization: Bearer <accessToken>."
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64
        tokenType:
          type: string
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
